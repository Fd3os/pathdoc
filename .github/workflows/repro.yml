name: repro

# Every rule, reproduced on a real Windows machine (code page 1252): the
# breakage before the cure, the success after it. Weekly, so a fix upstream
# shows up as a failing "before" and the rule gets its fixed-in version.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PATHDOC_REPRO_STRICT: "1"

jobs:
  gradle:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: go test -tags repro ./repro/ -v -count=1 -timeout 40m -run "TestRepro_gradle_"

  dart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: go test -tags repro ./repro/ -v -count=1 -timeout 20m -run "TestRepro_dart_"

  flutter:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.47.9 has the analyze bug; stable (3.50+) must have its fix.
        flutter: ["3.47.9", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          cache: true
      - run: go test -tags repro ./repro/ -v -count=1 -timeout 30m -run "TestRepro_flutter_"

  android:
    # A real flutter build apk --debug in each folder: the Android Gradle
    # Plugin's own path check, then the build from a junction.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: go test -tags repro ./repro/ -v -count=1 -timeout 60m -run "TestRepro_android_"

  web:
    # Web toolchains checked and fine (npm, Vite, Next.js, Tailwind, Prisma,
    # sharp), and node-gyp, which needs the runner's Visual Studio C++ tools.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: node --version
      - run: go test -tags repro ./repro/ -v -count=1 -timeout 40m -run "TestRepro_web_|TestRepro_node_gyp"

  python:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 has the bug; 3.15 made UTF-8 the default (PEP 686).
        python: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: go test -tags repro ./repro/ -v -count=1 -timeout 20m -run "TestRepro_python_"
