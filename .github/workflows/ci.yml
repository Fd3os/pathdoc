name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) { $bad; exit 1 }
      - run: go vet ./...
      - run: go vet -tags repro ./repro/
      - run: go test ./...
      - name: build and scan this runner
        shell: pwsh
        run: |
          go build -o pathdoc.exe ./cmd/pathdoc
          ./pathdoc.exe --json | Out-File -Encoding utf8 scan.json
          if ($LASTEXITCODE -gt 1) { exit 1 }
          Get-Content scan.json -Raw | ConvertFrom-Json | Out-Null
          ./pathdoc.exe
          exit 0
